AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Orbit AI — always-on personal agent. Scheduled Lambda gathers tasks (DynamoDB),
  GitHub activity, reasons with OpenAI, emails a briefing (SES), archives to S3.

Globals:
  Function:
    Timeout: 180
    MemorySize: 512

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: orbit-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: deadline
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-deadline-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: deadline
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OrbitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orbit-briefing
      Runtime: nodejs22.x
      Handler: src/handler.handler
      CodeUri: .
      Description: Orbit AI orchestrator - gather, reason, deliver, archive
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          REPORTS_BUCKET: !Ref ReportsBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TasksTable
        - S3CrudPolicy:
            BucketName: !Ref ReportsBucket
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/orbit/*
      Events:
        DailyBriefing:
          Type: ScheduleV2
          Properties:
            Name: orbit-daily-briefing
            Description: Fire the Orbit briefing every day at 6:00 AM Accra time
            ScheduleExpression: cron(0 6 * * ? *)
            ScheduleExpressionTimezone: Africa/Accra
            Input: '{"trigger":"scheduled"}'

  DashboardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: orbit-dashboard-api
      Runtime: nodejs22.x
      Handler: src/api/handler.handler
      CodeUri: .
      Timeout: 30
      Description: Orbit dashboard API - tasks CRUD, reports, run status, manual trigger
      Environment:
        Variables:
          TASKS_TABLE: !Ref TasksTable
          REPORTS_BUCKET: !Ref ReportsBucket
          BRIEFING_FUNCTION: !Ref OrbitFunction
      # Auth happens inside the handler: x-orbit-token checked against
      # SSM /orbit/dashboard-token. AuthType NONE just skips IAM SigV4.
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - "*"
          AllowHeaders:
            - content-type
            - x-orbit-token
          MaxAge: 86400
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TasksTable
        - S3ReadPolicy:
            BucketName: !Ref ReportsBucket
        - LambdaInvokePolicy:
            FunctionName: !Ref OrbitFunction
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/orbit/*

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*

Outputs:
  FunctionName:
    Description: Orbit orchestrator Lambda name
    Value: !Ref OrbitFunction
  FunctionArn:
    Description: Orbit orchestrator Lambda ARN
    Value: !GetAtt OrbitFunction.Arn
  TasksTableName:
    Description: DynamoDB tasks table
    Value: !Ref TasksTable
  ReportsBucketName:
    Description: S3 bucket for archived briefings
    Value: !Ref ReportsBucket
  DashboardApiUrl:
    Description: Function URL for the dashboard API
    Value: !GetAtt DashboardApiFunctionUrl.FunctionUrl
  WebBucketName:
    Description: S3 bucket hosting the dashboard frontend
    Value: !Ref WebBucket
  WebsiteUrl:
    Description: Public URL of the dashboard
    Value: !GetAtt WebBucket.WebsiteURL
